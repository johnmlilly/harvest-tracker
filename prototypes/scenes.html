<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harvest Tracker - Scenes (mockup)</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="mockup.css" />
</head>
<body data-season="fall">
  <div class="page">
    <header class="plank">
      <a class="brand" href="home.html">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 6 C44 10 46 30 40 52 L32 58 L24 52 C18 30 20 10 32 6Z" fill="#e9c24a" />
          <g stroke="#c99a2a" stroke-width="1.5" opacity=".7" fill="none"><path d="M28 12 L26 52 M32 8 V56 M36 12 L38 52 M22 20 H42 M21 28 H43 M21 36 H43 M22 44 H42" /></g>
          <path d="M24 52 C14 42 12 26 18 14 C22 30 26 42 32 58Z" fill="#5f9a3c" />
          <path d="M40 52 C50 42 52 26 46 14 C42 30 38 42 32 58Z" fill="#4a8530" />
        </svg>
        Harvest Tracker
      </a>
      <nav aria-label="Main">
        <ul class="nav">
          <li><a class="btn" href="home.html">Home</a></li>
          <li><a class="btn" href="scenes.html" aria-current="page">Scenes</a></li>
        </ul>
      </nav>
    </header>

    <h1>Scenes</h1>

    <ul class="scene-grid">
      <!-- Spring: tractor planting, seedlings, day -->
      <li>
        <a class="card scene-card" href="home.html?season=spring">
          <h2 class="card__title">Spring <span class="scene-card__months">March to May</span></h2>
          <svg class="scene" data-season="spring" data-time="day" viewBox="0 0 1600 900" aria-hidden="true">
            <circle cx="320" cy="190" r="52" fill="#fff6d6" />
            <g class="clouds"><g class="glide">
              <g data-art="cloud" transform="translate(700 150)"></g>
              <g data-art="cloud" transform="translate(1200 260) scale(.7)"></g>
            </g></g>
            <g class="land">
              <path d="M0 470 C200 430 380 455 560 440 C760 422 960 455 1160 432 C1340 412 1480 440 1600 430 L1600 620 L0 620 Z" fill="var(--hill-far)" />
              <path d="M0 540 C180 505 360 530 540 515 C720 500 900 530 1080 512 C1260 495 1420 520 1600 505 L1600 620 L0 620 Z" fill="var(--hill-mid)" />
              <g data-art="tree" transform="translate(80 540) scale(.65)" style="--leaf: var(--leaf-a)"></g>
              <g data-art="tree" transform="translate(190 532) scale(.75)" style="--leaf: var(--leaf-b)"></g>
              <g data-art="tree" transform="translate(300 540) scale(.6)" style="--leaf: var(--leaf-c)"></g>
              <g data-art="tree" transform="translate(1380 520) scale(.75)" style="--leaf: var(--leaf-a)"></g>
              <g data-art="tree" transform="translate(1490 526) scale(.65)" style="--leaf: var(--leaf-b)"></g>
              <g data-art="farmstead" transform="translate(900 590) scale(.7)"></g>
              <path d="M0 590 C300 575 700 585 1000 578 C1250 572 1450 580 1600 576 L1600 900 L0 900 Z" fill="var(--ground)" />
              <g fill="none" stroke="var(--ground-row)" stroke-linecap="round">
                <path d="M0 625 Q800 615 1600 620" stroke-width="5" /><path d="M0 665 Q800 655 1600 660" stroke-width="7" />
                <path d="M0 715 Q800 705 1600 710" stroke-width="9" /><path d="M0 780 Q800 770 1600 775" stroke-width="11" />
                <path d="M0 860 Q800 850 1600 855" stroke-width="13" />
              </g>
              <g transform="translate(0 600)"><rect width="760" height="24" fill="url(#seedlings)" /></g>
              <g transform="translate(0 638) scale(1.3)"><rect width="585" height="24" fill="url(#seedlings)" /></g>
              <g transform="translate(0 686) scale(1.7)"><rect width="447" height="24" fill="url(#seedlings)" /></g>
              <g class="pass"><g class="roll"><g transform="translate(900 760) scale(1.1)"><g data-art="planter"></g><g data-art="tractorBody"></g></g></g></g>
            </g>
          </svg>
          <div class="scene-card__meta"><span class="tag tag--default">Default scene</span></div>
        </a>
      </li>

      <!-- Summer: tall green corn, high sun -->
      <li>
        <a class="card scene-card" href="home.html?season=summer">
          <h2 class="card__title">Summer <span class="scene-card__months">June to August</span></h2>
          <svg class="scene" data-season="summer" data-time="day" viewBox="0 0 1600 900" aria-hidden="true">
            <circle cx="320" cy="190" r="52" fill="#fff6d6" />
            <g class="clouds"><g class="glide"><g data-art="cloud" transform="translate(1000 170)"></g></g></g>
            <g class="land">
              <path d="M0 470 C200 430 380 455 560 440 C760 422 960 455 1160 432 C1340 412 1480 440 1600 430 L1600 620 L0 620 Z" fill="var(--hill-far)" />
              <path d="M0 540 C180 505 360 530 540 515 C720 500 900 530 1080 512 C1260 495 1420 520 1600 505 L1600 620 L0 620 Z" fill="var(--hill-mid)" />
              <g data-art="tree" transform="translate(60 540) scale(.65)" style="--leaf: var(--leaf-a)"></g>
              <g data-art="tree" transform="translate(160 532) scale(.75)" style="--leaf: var(--leaf-b)"></g>
              <g data-art="tree" transform="translate(1120 526) scale(.7)" style="--leaf: var(--leaf-c)"></g>
              <g data-art="farmstead" transform="translate(1250 590) scale(.8)"></g>
              <g data-art="tree" transform="translate(1540 524) scale(.8)" style="--leaf: var(--leaf-a)"></g>
              <path d="M0 590 C300 575 700 585 1000 578 C1250 572 1450 580 1600 576 L1600 900 L0 900 Z" fill="var(--ground)" />
              <g transform="translate(0 540)" style="filter: brightness(.75)"><rect y="30" width="1600" height="100" fill="#2f6b27" /><rect width="1600" height="130" fill="url(#corn-summer)" /></g>
              <g transform="translate(-10 600) scale(1.3)"><rect y="30" width="1240" height="100" fill="#2f6b27" /><rect width="1240" height="130" fill="url(#corn-summer)" /></g>
              <g transform="translate(-20 690) scale(1.7)"><rect y="30" width="960" height="100" fill="#2a5f23" /><rect width="960" height="130" fill="url(#corn-summer)" /></g>
            </g>
          </svg>
          <div class="scene-card__meta"><span class="tag tag--default">Default scene</span></div>
        </a>
      </li>

      <!-- Fall: combine at dusk -->
      <li>
        <a class="card scene-card" href="home.html?season=fall">
          <h2 class="card__title">Fall <span class="scene-card__months">September to November</span></h2>
          <svg class="scene" data-season="fall" data-time="dusk" viewBox="0 0 1600 900" aria-hidden="true">
            <circle cx="300" cy="490" r="85" fill="#ffb766" />
            <g class="clouds"><g class="glide"><g data-art="cloud" transform="translate(800 150)"></g></g></g>
            <g class="land">
              <path d="M0 470 C200 430 380 455 560 440 C760 422 960 455 1160 432 C1340 412 1480 440 1600 430 L1600 620 L0 620 Z" fill="var(--hill-far)" />
              <path d="M0 540 C180 505 360 530 540 515 C720 500 900 530 1080 512 C1260 495 1420 520 1600 505 L1600 620 L0 620 Z" fill="var(--hill-mid)" />
              <g data-art="tree" transform="translate(60 540) scale(.65)" style="--leaf: var(--leaf-a)"></g>
              <g data-art="tree" transform="translate(170 532) scale(.75)" style="--leaf: var(--leaf-b)"></g>
              <g data-art="tree" transform="translate(280 540) scale(.6)" style="--leaf: var(--leaf-c)"></g>
              <g data-art="tree" transform="translate(560 528) scale(.8)" style="--leaf: var(--leaf-b)"></g>
              <g data-art="tree" transform="translate(760 530) scale(.7)" style="--leaf: var(--leaf-a)"></g>
              <g data-art="tree" transform="translate(1000 526) scale(.75)" style="--leaf: var(--leaf-c)"></g>
              <g data-art="farmstead" transform="translate(1250 600) scale(.8)"></g>
              <path d="M0 590 C300 575 700 585 1000 578 C1250 572 1450 580 1600 576 L1600 900 L0 900 Z" fill="var(--ground)" />
              <g fill="none" stroke="var(--ground-row)" stroke-linecap="round">
                <path d="M0 670 Q800 660 1600 666" stroke-width="3" stroke-dasharray="5 9" />
                <path d="M0 755 Q800 745 1600 751" stroke-width="5" stroke-dasharray="7 12" />
                <path d="M0 860 Q800 850 1600 856" stroke-width="8" stroke-dasharray="10 16" />
              </g>
              <g transform="translate(0 586)" style="filter: brightness(.72)"><rect y="28" width="640" height="102" fill="#9a7a32" /><rect width="640" height="130" fill="url(#corn-fall)" /></g>
              <g transform="translate(-9 604) scale(1.1)"><rect y="30" width="570" height="100" fill="#8a6c2a" opacity=".6" /><rect width="570" height="130" fill="url(#corn-fall)" /></g>
              <g class="creep"><g class="rock" style="transform-origin: 1037px 740px"><g data-art="combine" transform="translate(900 740) scale(1.05)"></g></g></g>
            </g>
            <g class="geese"><g transform="translate(900 200) scale(1.1)">
              <g data-art="goose"></g><g data-art="goose" transform="translate(48 -22)"></g><g data-art="goose" transform="translate(48 22)"></g>
              <g data-art="goose" transform="translate(96 -44)"></g><g data-art="goose" transform="translate(96 44)"></g>
            </g></g>
          </svg>
          <div class="scene-card__meta"><span class="tag tag--own">Has its own scene</span></div>
        </a>
      </li>

      <!-- Winter: snowy farm at night, glowing grain bin -->
      <li>
        <a class="card scene-card" href="home.html?season=winter">
          <h2 class="card__title">Winter <span class="scene-card__months">December to February</span></h2>
          <svg class="scene" data-season="winter" data-time="night" viewBox="0 0 1600 900" aria-hidden="true">
            <g data-art="stars"></g>
            <g data-art="moon" transform="translate(1265 160)"></g>
            <g class="land">
              <path d="M0 470 C200 430 380 455 560 440 C760 422 960 455 1160 432 C1340 412 1480 440 1600 430 L1600 620 L0 620 Z" fill="var(--hill-far)" />
              <path d="M0 540 C180 505 360 530 540 515 C720 500 900 530 1080 512 C1260 495 1420 520 1600 505 L1600 620 L0 620 Z" fill="var(--hill-mid)" />
              <g data-art="tree" transform="translate(80 540) scale(.65)" style="--leaf: var(--leaf-a)"></g>
              <g data-art="tree" transform="translate(190 532) scale(.75)" style="--leaf: var(--leaf-b)"></g>
              <g data-art="tree" transform="translate(1480 526) scale(.75)" style="--leaf: var(--leaf-c)"></g>
              <path d="M0 610 C300 595 700 605 1000 598 C1250 592 1450 600 1600 596 L1600 900 L0 900 Z" fill="var(--ground)" />
              <g data-art="farmstead" transform="translate(500 620) scale(.9)"></g>
              <g data-art="farmSnow" transform="translate(500 620) scale(.9)"></g>
              <g data-art="bin" transform="translate(1000 640) scale(1.1)"></g>

              </g>
            </g>
            <g data-art="farmLights" transform="translate(500 620) scale(.9)"></g>
            <g data-art="binLight" transform="translate(1000 640) scale(1.1)"></g>
            <g fill="#fff">
              <circle class="snow" cx="120" cy="0" r="5" /><circle class="snow" cx="320" cy="0" r="4" /><circle class="snow" cx="520" cy="0" r="6" />
              <circle class="snow" cx="760" cy="0" r="4" /><circle class="snow" cx="980" cy="0" r="5" /><circle class="snow" cx="1200" cy="0" r="4" />
              <circle class="snow" cx="1420" cy="0" r="6" /><circle class="snow" cx="1580" cy="0" r="4" /><circle class="snow" cx="660" cy="0" r="3" />
            </g>
          </svg>
          <div class="scene-card__meta"><span class="tag tag--default">Default scene</span></div>
        </a>
      </li>
    </ul>
  </div>
  <script src="art.js"></script>
</body>
</html>
